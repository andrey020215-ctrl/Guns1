<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEGASUS · Frost Arsenal — переливы</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#071323;color:#f2fbff}
body{margin:0;padding:24px;max-width:1120px;margin-inline:auto;background:radial-gradient(circle at 90% 2%,#20557870,transparent 45%),#071323}
header{display:flex;align-items:center;gap:15px}h1{font:600 36px Georgia,serif;margin:0;color:#c0ebff}small,.muted{color:#9bb6c9}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button,.weapons button{background:#102943;border:1px solid #416580;color:white;border-radius:9px;padding:11px;cursor:pointer}.tabs button.on,.weapons button.on{background:#1765a5;border-color:#a1e9ff}
.layout{display:grid;grid-template-columns:240px 1fr;gap:24px}.weapons{display:grid;gap:8px;align-content:start}.weapons button{text-align:left}
.stage{background:linear-gradient(115deg,#0a1626,#14314b);border:1px solid #467693;border-radius:20px;padding:22px;min-height:400px;overflow:hidden}
.gun{height:190px;position:relative;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 12px 16px #0009)}
.silhouette{width:min(95%,580px);height:90px;background:linear-gradient(170deg,#12263e,#3b5879 45%,#08111b 45%,#192f4d);border:2px solid #7aafc3;border-radius:13px 7px 20px 7px;position:relative;transform:skewX(-8deg)}
.silhouette::before{content:"";position:absolute;left:-16%;top:31%;width:16%;height:25px;background:#597b9e;box-shadow:0 0 3px #99e9ff;border-radius:3px}
.silhouette::after{content:"";position:absolute;left:56%;top:85%;width:21%;height:65px;clip-path:polygon(0 0,100% 0,75% 100%,10% 100%);background:linear-gradient(120deg,#314f71,#101a2f);border:1px solid #6dbdea}
.fx{position:absolute;inset:0;opacity:.9;mix-blend-mode:screen;border-radius:12px;background:linear-gradient(105deg,transparent 10%,#dff9ff66 33%,#f3ffff 45%,#58afff77 53%,transparent 69%);background-size:250% 100%;animation:travel 5s linear infinite}
.gun[data-tier="2"] .fx{background:repeating-linear-gradient(130deg,transparent 0 18px,#0ac6ff99 19px 23px,transparent 24px 40px),linear-gradient(110deg,transparent 30%,#32f5fbbb 48%,transparent 61%);background-size:210% 100%;animation-duration:3.5s}
.gun[data-tier="3"] .fx{background:linear-gradient(90deg,transparent,#00e9ffaa 25%,#4cffe5bb 44%,#8d48ffbb 70%,transparent);background-size:230% 100%;animation-duration:4s}
@keyframes travel{from{background-position:190% 0}to{background-position:-90% 0}}
.chip{display:inline-block;background:#103753;border:1px solid #5c93af;padding:5px 10px;border-radius:20px}
.swatch{height:44px;margin-top:10px;border:1px solid #ffffff55;border-radius:10px;background:linear-gradient(100deg,#17364d,#cefcff,#2695cf,#27e0d7,#7059e9,#17364d);background-size:220%;animation:travel 4s linear infinite}
.note{font-size:13px;line-height:1.5;color:#a8c4d6}@media(max-width:700px){.layout{grid-template-columns:1fr}.weapons{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:24px}}
</style></head><body>
<header><span style="font-size:34px">❄</span><div><h1>PEGASUS · Frost Arsenal</h1><small>Живые переливы · 12 оружий · браузерный концепт, не рендер Source 2</small></div></header>
<div class="tabs" id="tiers"></div>
<div class="layout"><nav class="weapons" id="weapons"></nav>
<section class="stage"><span class="chip" id="title"></span><div class="gun" id="gun" data-tier="1"><div class="silhouette"><div class="fx"></div></div></div><h2 id="name"></h2><p id="ability"></p><p class="muted" id="texture"></p><div class="swatch"></div><p class="note">Световая анимация непрерывна даже если оружие неподвижно. Текущий силуэт схематический, не точная модель CS2. Цена и VIP-права будут проверяться на сервере.</p></section></div>
<script>
const items=[{"id":"mp9","tier":1,"name":"MP9 «Снегирь»","ability":"Зимний порыв","material":"Графит, белый иней, красный снегирь и ягоды"},{"id":"famas","tier":1,"name":"FAMAS «Снежный дозор»","ability":"Полярный резерв","material":"Арктический камуфляж, зимний лес, ледяные горы"},{"id":"nova","tier":1,"name":"Nova «Хрусталь»","ability":"Кристальный панцирь","material":"Сапфировые кристаллы, серебряные снежинки"},{"id":"glock18","tier":1,"name":"Glock-18 «Морозный импульс»","ability":"Морозная серия","material":"Бело-серебряный затвор, голубые линии и снежинки"},{"id":"ak47","tier":2,"name":"AK-47 «Frostbite»","ability":"Обморожение","material":"Чёрный металл, расколотые ледяные пластины, серебряный Пегас"},{"id":"m4a1s","tier":2,"name":"M4A1-S «Blizzard»","ability":"Тихая метель","material":"Белая керамика, тёмно-синие вихри метели"},{"id":"ssg08","tier":2,"name":"SSG 08 «Полярный след»","ability":"Снежный след","material":"Полярные горы, карта звёзд, бирюзовые линии"},{"id":"usp_s","tier":2,"name":"USP-S «Призрачный иней»","ability":"Призрачный шаг","material":"Чёрный матовый корпус, серебряные руны, светящиеся трещины глушителя"},{"id":"awp","tier":3,"name":"AWP «Ice Dragon»","ability":"Ледяное эхо","material":"Обсидиан, ледяной дракон, серебряная чешуя и голубое сияние"},{"id":"xm1014","tier":3,"name":"XM1014 «Вьюжный клык»","ability":"Криоимпульс","material":"Белая керамика, ледяные клыки и бордовые акценты"},{"id":"negev","tier":3,"name":"Negev «Вечная мерзлота»","ability":"Сердце зимы","material":"Тёмный металл, кристаллы, ледниковые пластины"},{"id":"deagle","tier":3,"name":"Desert Eagle «Полярная буря»","ability":"Полярный удар","material":"Тёмный титан, ледяные трещины, серебряный Пегас, северное сияние"}];
const labels=["","Иней","Метель","Аврора"];
let tier=1,selected=items[0].id;
const $=id=>document.getElementById(id);
function render(){
$("tiers").innerHTML=[1,2,3].map(n=>'<button class="'+(tier===n?'on':'')+'" data-t="'+n+'">VIP '+["","I","II","III"][n]+' · '+labels[n]+'</button>').join('');
$("weapons").innerHTML=items.filter(w=>w.tier===tier).map(w=>'<button class="'+(w.id===selected?'on':'')+'" data-w="'+w.id+'">'+w.name+'</button>').join('');
const w=items.find(x=>x.id===selected);$("gun").dataset.tier=tier;$("title").textContent='VIP '+["","I","II","III"][tier]+' · '+labels[tier];$("name").textContent=w.name;$("ability").textContent=w.ability;$("texture").textContent=w.material;
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tier=Number(b.dataset.t);selected=items.find(x=>x.tier===tier).id;render()});
document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{selected=b.dataset.w;render()});
}
render();
</script></body></html>
